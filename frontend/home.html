<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Atendimentos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-container">
  <h2>Bem-vindo ao sistema</h2>

  <h3>Novo Atendimento</h3>
  <form id="form-atendimento" autocomplete="off">
    <input
      type="text"
      id="titulo"
      placeholder="Título do atendimento"
      required
    />
    <textarea
      id="descricao"
      placeholder="Descrição do atendimento"
      required></textarea>

    <button type="submit">Cadastrar</button>
    <p id="msg-form"></p>
  </form>

  <h3>Atendimentos</h3>
  <div id="lista-atendimentos">
    <p>Carregando atendimentos...</p>
  </div>

  <button type="button" onclick="logout()">Sair</button>
</div>

<div id="modal-editar" class="modal hidden">
  <div class="modal-content">
    <h3>Editar Atendimento</h3>

    <input type="text" id="edit-titulo" placeholder="Título do atendimento" />
    <textarea id="edit-descricao" placeholder="Descrição do atendimento"></textarea>

    <div class="modal-acoes">
      <button onclick="fecharModal()">Cancelar</button>
      <button onclick="salvarEdicao()">Salvar</button>
    </div>
  </div>
</div>


<script>
let atendimentoEditando = null;

/* ===== PROTEÇÃO ===== */
if (sessionStorage.getItem("logado") !== "true") {
  window.location.href = "login.html";
}

function logout() {
  sessionStorage.clear();
  window.location.href = "login.html";
}

const usuarioId = sessionStorage.getItem("usuario_id");
let cacheAtendimentos = [];

/* ===== LISTAR ===== */
async function carregarAtendimentos() {
  const lista = document.getElementById("lista-atendimentos");

  try {
    const response = await fetch("http://localhost:3000/api/atendimentos", {
  headers: {
    "x-user-id": sessionStorage.getItem("usuario_id")
  }
});


    const atendimentos = await response.json();
    cacheAtendimentos = atendimentos;

    if (!Array.isArray(atendimentos) || atendimentos.length === 0) {
      lista.innerHTML = "<p>Nenhum atendimento registrado.</p>";
      return;
    }

    lista.innerHTML = "";

    atendimentos.forEach(at => {
  const item = document.createElement("div");
  item.classList.add("atendimento");

  const dataFormatada = at.criado_em
    ? new Date(at.criado_em.replace(" ", "T")).toLocaleString("pt-BR")
    : "Sem data";

  item.innerHTML = `
    <h4>${at.titulo}</h4>

    <span class="status ${at.status}">
      ${at.status}
    </span>

    <p class="data">${dataFormatada}</p>
    <p class="descricao">${at.descricao}</p>

    <div class="acoes">
      <button onclick="editarAtendimento(${at.id})">Editar</button>
      <button class="btn-danger" onclick="excluirAtendimento(${at.id})">Excluir</button>
    </div>
  `;

  // 🔥 ISSO AQUI É O QUE FALTAVA
  lista.appendChild(item);
});


  } catch (err) {
    lista.innerHTML = "<p>Erro ao carregar atendimentos</p>";
    console.error(err);
  }
}

carregarAtendimentos();

/* ===== CRIAR ===== */
document.getElementById("form-atendimento").addEventListener("submit", async (e) => {
  e.preventDefault();

  const titulo = document.getElementById("titulo").value;
  const descricao = document.getElementById("descricao").value;
  const msg = document.getElementById("msg-form");

  msg.innerText = "Enviando...";

  try {
    const response = await fetch("http://localhost:3000/api/atendimentos", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-user-id": usuarioId
      },
      body: JSON.stringify({ titulo, descricao })
    });

    if (!response.ok) throw new Error();

    msg.innerText = "Atendimento cadastrado com sucesso!";
    msg.style.color = "green";
    e.target.reset();
    carregarAtendimentos();

  } catch {
    msg.innerText = "Erro ao cadastrar atendimento";
    msg.style.color = "red";
  }
});

/* ===== EXCLUIR ===== */
async function excluirAtendimento(id) {
  if (!confirm("Deseja excluir este atendimento?")) return;

  const res = await fetch(`http://localhost:3000/api/atendimentos/${id}`, {
    method: "DELETE",
    headers: {
      "x-user-id": usuarioId
    }
  });

  if (res.ok) carregarAtendimentos();
  else alert("Sem permissão para excluir");
}
function editarAtendimento(id) {
  const atual = cacheAtendimentos.find(a => a.id === id);
  if (!atual) return;

  atendimentoEditando = atual;

  document.getElementById("edit-titulo").value = atual.titulo;
  document.getElementById("edit-descricao").value = atual.descricao;

  document.getElementById("modal-editar").classList.remove("hidden");
}
//fechar modal
function fecharModal() {
  atendimentoEditando = null;
  document.getElementById("modal-editar").classList.add("hidden");
}
//salvar edição
async function salvarEdicao() {
  if (!atendimentoEditando) return;

  const titulo = document.getElementById("edit-titulo").value;
  const descricao = document.getElementById("edit-descricao").value;

  const res = await fetch(
    `http://localhost:3000/api/atendimentos/${atendimentoEditando.id}`,
    {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "x-User-Id": sessionStorage.getItem("usuario_id")
      },
      body: JSON.stringify({ titulo, descricao })
    }
  );

  if (res.ok) {
    fecharModal();
    carregarAtendimentos();
  } else {
    alert("Erro ao editar");
  }
}

</script>

</body>
</html>
