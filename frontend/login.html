<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Sistema de Atendimentos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-container">
    <h2 class="titulogin">Entrar no sistema</h2>

    <form id= "loginForm" autocomplete="off">
      <label>Email</label>
      <input class="email" type="email" id="email" autocomplete="off" placeholder="email@exemplo.com" required />
      <br>

      <label>Senha</label>
      <input class="senha" type="password" id="senha" placeholder="********" required />
      <br>

      <button class=entrar type="submit">Entrar</button>
      <p id="mensagem"></p>
    </form>
    <script src="js/login.js"></script>
  </div>
</body>
</html>
